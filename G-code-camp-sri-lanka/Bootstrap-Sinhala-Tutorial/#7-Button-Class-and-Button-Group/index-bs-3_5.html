<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>#7-Button-Class-and-Button-Group</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container mt-5">
      <h1>Buttons</h1>
      <button class="btn btn-primary">Primary</button>
      <button class="btn btn-secondary">Secondary</button>
      <button class="btn btn-success">Success</button>
      <button class="btn btn-danger">Danger</button>
      <button class="btn btn-warning">Warning</button>
      <button class="btn btn-info">Info</button>
      <button class="btn btn-light">Light</button>
      <button class="btn btn-dark">Dark</button>
      <button class="btn btn-link">Link</button>
      <hr />
      <h1>Tags</h1>
      <a href="www.google.com" class="btn btn-dark" role="button">Google</a>
      <hr />
      <h1>Button Group</h1>
     <div class="btn-group">
        <button class="btn btn-primary">Left</button>
        <button class="btn btn-primary">Middle</button>
        <button class="btn btn-primary">Right</button>
      </div>
      <hr />
      <h1>Button Group Verticle</h1>
     <div class="btn-group-vertical">
        <button class="btn btn-primary">Left</button>
        <button class="btn btn-primary">Middle</button>
        <button class="btn btn-primary">Right</button>
      </div>
      <hr />
      <h1>Button Group Sizing</h1>
     <div class="btn-group-sm">
        <button class="btn btn-primary">Left</button>
        <button class="btn btn-primary">Middle</button>
        <button class="btn btn-primary">Right</button>
      </div>
      <br>
      <div class="btn-group-lg">
        <button class="btn btn-primary">Left</button>
        <button class="btn btn-primary">Middle</button>
        <button class="btn btn-primary">Right</button>
      </div>
     <hr />
      <h1>Input as abutton</h1>
      <input type="button" class="btn btn-primary" value="Input Button" />
      <hr />
      <h1>Button Outline</h1>
      <button class="btn btn-outline-primary">Primary</button>
      <hr />
      <h1>Button Sizing</h1>
      <button class="btn btn-lg btn-primary">Primary Large</button>
      <button class="btn btn-sm btn-warning">Warning Small</button>
      <hr />
      <h1>Button Activity</h1>
      <button class="btn btn-lg btn-primary active">Primary Large Active</button>
      <button class="btn btn-sm btn-warning disabled">Warning Small Disabled</button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  </body>
</html>

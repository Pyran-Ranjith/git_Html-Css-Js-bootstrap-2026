<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>#4-Bootstrap-Row-&-12-Grid-System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <div class="row">

        <div class="col-12">
          <img src="img/cover.jpg" class="mx-auto d-block" alt="cover.jpg" style="width: 700px; height: 300px; margin-bottom:20px" />
        </div>

        <div class="col-6 col-md-4">
          <img src="img/1.jpg" class="mx-auto d-block" alt="1.jpg" style="width: 250px; height: 250px;" />
        </div>

        <div class="col-6 col-md-4">
          <img src="img/2.jpg" class="mx-auto d-block" alt="2.jpg" style="width: 250px; height: 250px;" />
        </div>

        <div class="col-4 col-md-4">
          <img src="img/3.jpg" alt="3.jpg" style="width: 250px; height: 250px;" />
        </div>

      </div>
    </div>
  </body>
</html>
